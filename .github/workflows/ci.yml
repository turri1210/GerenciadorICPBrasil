name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        shell: pwsh
        run: dotnet restore AssistenteICP.sln --locked-mode

      - name: Build
        shell: pwsh
        run: dotnet build AssistenteICP.sln -c Release --no-restore

      - name: Tests
        shell: pwsh
        run: dotnet run --project tests/SecurityPolicyChecks/SecurityPolicyChecks.csproj -c Release

      - name: Reject secrets and private keys
        shell: pwsh
        run: |
          $patterns = 'certificatePassword|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|x-gerenciador-key|AuditKey|gh[pousr]_[A-Za-z0-9]{30,}'
          $hits = git grep -n -I -E $patterns -- . ':!.github/workflows/ci.yml'
          if ($LASTEXITCODE -eq 0) { throw "Padrão proibido encontrado:`n$hits" }
          if ($LASTEXITCODE -gt 1) { throw 'Falha ao executar a varredura.' }
