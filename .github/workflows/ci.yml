name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.425
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        shell: pwsh
        run: dotnet restore GerenciadorICPBrasil.sln --locked-mode

      - name: Build
        shell: pwsh
        run: dotnet build GerenciadorICPBrasil.sln -c Release --no-restore

      - name: Tests
        shell: pwsh
        run: dotnet run --project tests/SecurityPolicyChecks/SecurityPolicyChecks.csproj -c Release

      - name: Reject secrets and private keys
        shell: pwsh
        run: |
          $patterns = 'certificatePassword|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|x-gerenciador-key|AuditKey|gh[pousr]_[A-Za-z0-9]{30,}'
          $hits = git grep -n -I -E $patterns -- . ':!.github/workflows/ci.yml'
          $grepExitCode = $LASTEXITCODE
          if ($grepExitCode -eq 0) { throw "Padrão proibido encontrado:`n$hits" }
          if ($grepExitCode -gt 1) { throw 'Falha ao executar a varredura.' }
          Write-Host 'Nenhum padrão proibido encontrado.'
          exit 0
