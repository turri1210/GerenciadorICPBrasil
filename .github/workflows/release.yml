name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validar versão da tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Use tags no formato v1.2.3.' }
          "value=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.425
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restaurar e testar
        shell: pwsh
        run: |
          dotnet restore GerenciadorICPBrasil.sln --locked-mode
          dotnet run --project tests/SecurityPolicyChecks/SecurityPolicyChecks.csproj -c Release

      - name: Gerar aplicativo
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Validar aplicativo
        shell: pwsh
        run: ./scripts/verify-release.ps1 -Version '${{ steps.version.outputs.value }}' -ArtifactDirectory artifacts/app-unsigned

      - name: Importar certificado de assinatura
        shell: pwsh
        env:
          CODE_SIGN_PFX_BASE64: '${{ secrets.CODE_SIGN_PFX_BASE64 }}'
          CODE_SIGN_PFX_PASSWORD: '${{ secrets.CODE_SIGN_PFX_PASSWORD }}'
        run: |
          if (-not $env:CODE_SIGN_PFX_BASE64 -or -not $env:CODE_SIGN_PFX_PASSWORD) {
            throw 'Configure CODE_SIGN_PFX_BASE64 e CODE_SIGN_PFX_PASSWORD como segredos do repositório.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'code-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))
            $password = ConvertTo-SecureString $env:CODE_SIGN_PFX_PASSWORD -AsPlainText -Force
            $certificates = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            $thumbprint = '038406E8CB7700739D12CD73A911DF5E90DED643'
            $certificate = $certificates | Where-Object Thumbprint -eq $thumbprint | Select-Object -First 1
            if (-not $certificate -or -not $certificate.HasPrivateKey) {
              throw 'O PFX não corresponde ao certificado Rede ICP Brasil autorizado.'
            }
            "CODE_SIGN_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV
          }
          finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Assinar aplicativo e auxiliares
        shell: pwsh
        run: |
          $signTool = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) { throw 'SignTool x64 não encontrado.' }
          "SIGNTOOL_PATH=$signTool" >> $env:GITHUB_ENV
          Copy-Item -LiteralPath artifacts/app-unsigned -Destination artifacts/app-signed -Recurse
          $files = @(
            'GerenciadorIcpBrasil.exe',
            'GerenciadorIcpBrasil.dll',
            'Helpers\ElevatedConfiguration\ConfigAuditoria.exe',
            'Helpers\ElevatedConfiguration\ConfigAuditoria.dll',
            'Helpers\CertificateSelector\CertSelector.exe'
          )
          foreach ($file in $files) {
            $path = Join-Path (Resolve-Path artifacts/app-signed).Path $file
            & $signTool sign /sha1 $env:CODE_SIGN_THUMBPRINT /s My /fd SHA256 /d 'Gerenciador ICP Brasil' $path
            if ($LASTEXITCODE -ne 0) { throw "Falha ao assinar $file" }
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.SignerCertificate.Thumbprint -ne $env:CODE_SIGN_THUMBPRINT -or
                $signature.Status -notin @('Valid', 'NotTrusted')) {
              throw "Assinatura inválida em $file"
            }
          }

      - name: Instalar Inno Setup fixado
        shell: pwsh
        run: choco install innosetup --version=6.4.3 --yes --no-progress

      - name: Compilar instalador
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $source = (Resolve-Path artifacts/app-signed).Path
          $output = Join-Path $PWD 'artifacts\installer-unsigned'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" "/DSourceDir=$source" "/DOutputDir=$output" installer/GerenciadorICPBrasil.iss
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao compilar o instalador.' }

      - name: Validar e publicar release
        shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $installer = Join-Path $PWD "artifacts\installer-unsigned\GerenciadorICPBrasilSetup-$version.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw 'Instalador não encontrado.' }
          & $env:SIGNTOOL_PATH sign /sha1 $env:CODE_SIGN_THUMBPRINT /s My /fd SHA256 /d 'Gerenciador ICP Brasil' $installer
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao assinar o instalador.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.SignerCertificate.Thumbprint -ne $env:CODE_SIGN_THUMBPRINT -or
              $signature.Status -notin @('Valid', 'NotTrusted')) {
            throw 'Assinatura do instalador inválida.'
          }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          "$hash  $(Split-Path $installer -Leaf)" | Set-Content artifacts/SHA256SUMS.txt
          gh release create '${{ github.ref_name }}' $installer artifacts/SHA256SUMS.txt --verify-tag --generate-notes

      - name: Remover certificado do runner
        if: always()
        shell: pwsh
        run: |
          if ($env:CODE_SIGN_THUMBPRINT) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:CODE_SIGN_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
